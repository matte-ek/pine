name: Build Linux

on:
  push:
    branches: [ "main", "dev", "scripting", "ai" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  PHYSX_URL: "https://github.com/NVIDIA-Omniverse/PhysX/archive/refs/tags/110.1-omni-and-physx-5.9.0.zip"
  PHYSX_HASH: "c5f73d10c3e2899513051be1ae1082ec0da95cfef2f05efc609a3471d4f77f27"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential cmake ninja-build wget p7zip-full patch python3 \
          libglew-dev libglfw3-dev libglm-dev libassimp-dev libstb-dev \
          nlohmann-json3-dev libfmt-dev libfreetype-dev libmono-2.0-dev \
          libopenal-dev libjpeg-turbo8-dev libpng-dev zlib1g-dev

    # PhysX is not committed to the repo; build it once and cache the result.
    # Keyed on the PhysX version plus the build patch/preset, so it rebuilds
    # only when one of those changes.
    - name: Cache PhysX
      id: cache-physx
      uses: actions/cache@v4
      with:
        path: third-party/physx
        key: ${{ runner.os }}-physx-${{ env.PHYSX_HASH }}-${{ hashFiles('.external-required/cmake-patch.diff', '.external-required/linux-gcc-cpu-only-no-snippets.xml') }}

    - name: Build PhysX
      if: steps.cache-physx.outputs.cache-hit != 'true'
      run: |
        set -e
        ROOT="$GITHUB_WORKSPACE"
        mkdir -p external && cd external
        wget -O physx.zip "$PHYSX_URL"
        echo "$PHYSX_HASH  physx.zip" | sha256sum -c
        7z x physx.zip > /dev/null
        cd PhysX-110.1-omni-and-physx-5.9.0/physx
        patch --merge -i "$ROOT/.external-required/cmake-patch.diff" source/compiler/cmake/linux/CMakeLists.txt
        cp "$ROOT/.external-required/linux-gcc-cpu-only-no-snippets.xml" buildtools/presets/public/
        ./generate_projects.sh linux-gcc-cpu-only-no-snippets
        cd compiler/linux-gcc-cpu-only-no-snippets-checked
        make -j"$(nproc)"
        mkdir -p "$ROOT/third-party/physx/lib" "$ROOT/third-party/physx/include"
        cp ../../bin/linux.x86_64/checked/*.a "$ROOT/third-party/physx/lib/"
        cp -r ../../include/* "$ROOT/third-party/physx/include/"

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Engine
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target Engine
